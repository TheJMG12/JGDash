<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JGDash — Projects</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/sync.js?v=10"></script>
  <script>!function(){try{if(localStorage.getItem('jg_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}}()</script>
  <script src="js/theme.js?v=3"></script>
  <script src="js/topbar.js?v=10"></script>
  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --success: #6BE3A4;
      --warning: #F2C063;
      --danger: #FF6B6B;
      --bg: #050506;
      --card-bg: rgba(255, 255, 255, 0.04);
      --accent: #6BE3A4;
      --border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.05);
      --sidebar-w: 220px;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="light"] {
      --text-primary: #1A1917;
      --text-secondary: #5C5A54;
      --text-tertiary: #8A8780;
      --bg: #F4F3F0;
      --card-bg: rgba(255, 255, 255, 0.72);
      --border: rgba(0, 0, 0, 0.1);
      --input-bg: rgba(255, 255, 255, 0.9);
      --success: #1F9D62;
      --warning: #C4841A;
      --danger: #D64545;
      --accent: #1F9D62;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: var(--sans);
      color: var(--text-primary);
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 60%),
        radial-gradient(ellipse 45% 35% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 55%);
      filter: blur(40px);
      animation: wash-drift 36s ease-in-out infinite alternate;
    }

    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 50% 40% at 82% 14%, rgba(224, 118, 88, 0.1), transparent 60%),
        radial-gradient(ellipse 45% 35% at 18% 90%, rgba(100, 120, 180, 0.06), transparent 55%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.014) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
    }

    [data-theme="light"] body::after {
      background-image: radial-gradient(rgba(0, 0, 0, 0.03) 0.6px, transparent 0.6px);
    }

    @keyframes wash-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-3%, 2%) scale(1.04); }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: var(--accent); }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* —— Sidebar —— */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    [data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.55);
    }

    .sidebar-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 8px 10px 14px;
      text-transform: uppercase;
    }

    .nav-link {
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      text-align: left;
      width: 100%;
    }

    .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .nav-link.active {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .sidebar-section {
      margin-top: 16px;
      padding: 0 10px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .saved-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      margin: 2px 4px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--input-bg);
    }

    .saved-pill:hover, .saved-pill.active {
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      color: var(--accent);
    }

    .sidebar-back {
      margin-top: auto;
      padding: 12px 10px 4px;
      font-size: 12px;
    }

    .mobile-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .hamburger {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: var(--text-primary);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }

    /* —— Main —— */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
      overflow: hidden;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 48px;
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-right: auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      min-width: 160px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 13px;
      color: var(--text-primary);
    }

    .search-input::placeholder { color: var(--text-tertiary); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-secondary);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.16); }
    .btn.primary {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent);
    }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 32%, transparent); }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

    .select {
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .view-toggle button {
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      border-right: 1px solid var(--border);
    }

    .view-toggle button:last-child { border-right: none; }
    .view-toggle button.active {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
    }

    /* —— Cards —— */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
    }

    [data-theme="light"] .card {
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .card.at-risk {
      background: color-mix(in srgb, var(--warning) 8%, var(--card-bg));
      border-color: color-mix(in srgb, var(--warning) 30%, transparent);
    }

    /* —— KPI —— */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi {
      padding: 12px 14px;
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .kpi-value.warn { color: var(--warning); }
    .kpi-value.danger { color: var(--danger); }
    .kpi-value.ok { color: var(--success); }

    /* —— Attention —— */
    .attention {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-secondary);
    }

    .chip:hover { color: var(--text-primary); }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .chip .n {
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
    }
    .chip.overdue .n { background: color-mix(in srgb, var(--danger) 25%, transparent); color: var(--danger); }
    .chip.blocked .n { background: color-mix(in srgb, var(--warning) 25%, transparent); color: var(--warning); }

    /* —— Filter panel —— */
    .filter-panel {
      display: none;
      margin-bottom: 14px;
      padding: 14px;
      gap: 12px;
    }

    .filter-panel.open { display: grid; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 13px;
      color: var(--text-primary);
    }

    .field textarea { min-height: 72px; resize: vertical; }

    .filter-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* —— Bulk bar —— */
    .bulk-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 12%, var(--card-bg));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      font-size: 13px;
    }

    .bulk-bar.show { display: flex; flex-wrap: wrap; }

    /* —— Table / List —— */
    .table-wrap { overflow-x: auto; }

    table.proj-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .proj-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .proj-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }

    [data-theme="light"] .proj-table td {
      border-bottom-color: rgba(0,0,0,0.06);
    }

    .proj-table tr:hover td { background: rgba(255,255,255,0.02); }

    .proj-name {
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .proj-name-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .proj-name-btn:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .pin-btn {
      color: var(--text-tertiary);
      font-size: 14px;
      line-height: 1;
      padding: 2px;
    }

    .pin-btn.pinned { color: var(--warning); }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.s-Not-Started { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .badge.s-Planning { background: rgba(125, 211, 252, 0.15); color: #7DD3FC; }
    .badge.s-In-Progress { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .badge.s-Blocked { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
    .badge.s-On-Hold { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
    .badge.s-Completed { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
    .badge.s-Archived { background: rgba(255,255,255,0.05); color: var(--text-tertiary); }

    .badge.p-Low { background: rgba(255,255,255,0.05); color: var(--text-tertiary); }
    .badge.p-Medium { background: rgba(125, 211, 252, 0.12); color: #7DD3FC; }
    .badge.p-High { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
    .badge.p-Critical { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }

    .badge.r-Low { color: var(--success); }
    .badge.r-Medium { color: var(--warning); }
    .badge.r-High { color: var(--danger); }

    .date-cell.overdue { color: var(--danger); font-weight: 600; }

    .progress {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      min-width: 64px;
    }

    .progress > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-pct {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
      min-width: 32px;
    }

    .status-select {
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 12px;
      color: var(--text-secondary);
      max-width: 120px;
    }

    .row-menu-wrap { position: relative; }

    .menu-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      color: var(--text-tertiary);
      font-size: 16px;
    }

    .menu-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

    .dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      z-index: 15;
      min-width: 160px;
      padding: 6px;
      border-radius: 12px;
      background: #121214;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }

    [data-theme="light"] .dropdown {
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .dropdown.open { display: block; }

    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .dropdown button:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .dropdown button.danger { color: var(--danger); }

    .group-header {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      padding: 14px 4px 8px;
    }

    /* —— Board —— */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .board-col {
      background: rgba(0,0,0,0.2);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid var(--border);
      min-height: 120px;
    }

    [data-theme="light"] .board-col { background: rgba(255,255,255,0.4); }

    .board-col-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
    }

    .board-card {
      padding: 12px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .board-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .board-card.at-risk {
      background: color-mix(in srgb, var(--warning) 8%, var(--card-bg));
    }

    .board-card h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .board-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* —— Timeline —— */
    .timeline-month {
      margin-bottom: 18px;
    }

    .timeline-month h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      margin-bottom: 6px;
      align-items: center;
    }

    .timeline-date {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
      min-width: 88px;
    }

    .timeline-date.overdue { color: var(--danger); }

    /* —— Analytics —— */
    .analytics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    .analytics .card h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .chart-wrap { display: flex; align-items: center; gap: 14px; }
    .legend { font-size: 11px; color: var(--text-tertiary); display: grid; gap: 4px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .bar-row {
      display: grid;
      grid-template-columns: 72px 1fr 28px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .bar-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .bar-track > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .mini-list {
      list-style: none;
      font-size: 12px;
    }

    .mini-list li {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--text-secondary);
    }

    .mini-list li:last-child { border-bottom: none; }

    /* —— Detail records —— */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .detail-card {
      padding: 14px;
    }

    .detail-card h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-desc {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text-tertiary);
      margin: 2px 2px 0 0;
      text-transform: lowercase;
    }

    .tag.tag-cyber {
      background: color-mix(in srgb, #3b82f6 22%, transparent);
      color: #93c5fd;
    }
    .tag.tag-soccer {
      background: color-mix(in srgb, #22c55e 22%, transparent);
      color: #86efac;
    }
    .tag.tag-personal {
      background: color-mix(in srgb, #f59e0b 22%, transparent);
      color: #fcd34d;
    }

    [data-theme="light"] .tag.tag-cyber { color: #1d4ed8; }
    [data-theme="light"] .tag.tag-soccer { color: #15803d; }
    [data-theme="light"] .tag.tag-personal { color: #b45309; }

    .tag-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tag-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      margin: 0;
      font-weight: 500;
    }

    .tag-check input { width: auto; margin: 0; accent-color: var(--accent); }

    .tag-check.on {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      background: color-mix(in srgb, var(--accent) 12%, var(--input-bg));
    }

    .tag-add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tag-add-row input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 13px;
      color: var(--text-primary);
    }

    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 0;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }

    .tag-chip button {
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }

    .tag-chip button:hover { color: var(--danger, #FF6B6B); }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin: 18px 0 10px;
    }

    /* —— Empty / Skeleton —— */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-tertiary);
      font-size: 14px;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .skel {
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .hidden { display: none !important; }

    /* —— Modal —— */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 16px;
      background: #121214;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }

    [data-theme="light"] .modal { background: #fff; }

    .modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-grid .full { grid-column: 1 / -1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .form-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .form-error.show { display: block; }

    /* —— Responsive —— */
    @media (max-width: 1100px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
      .analytics { grid-template-columns: 1fr 1fr; }
      .skeleton-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 50;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 8px 0 32px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .mobile-bar { display: flex; }
      .main { max-height: none; }

    }

    @media (max-width: 560px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
      .modal-grid { grid-template-columns: 1fr; }
      .page-title { width: 100%; margin-bottom: 4px; }
    }

  var projectsTombstones = {};

  function stripOwner(list) {
    return (list || []).map(function (p) {
      if (!p || typeof p !== 'object' || !('owner' in p)) return p;
      var copy = Object.assign({}, p);
      delete copy.owner;
      return copy;
    });
  }

  function normalizeProjectsStore(parsed) {
    if (Array.isArray(parsed)) {
      return { items: stripOwner(parsed), tombstones: {} };
    }
    if (parsed && typeof parsed === 'object') {
      return {
        items: stripOwner(Array.isArray(parsed.items) ? parsed.items : []),
        tombstones: (parsed.tombstones && typeof parsed.tombstones === 'object' && !Array.isArray(parsed.tombstones))
          ? Object.assign({}, parsed.tombstones)
          : {}
      };
    }
    return { items: [], tombstones: {} };
  }

  function loadProjects() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw == null) {
        var seed = sampleProjects();
        projectsTombstones = {};
        saveProjects(seed);
        return seed;
      }
      var parsed = JSON.parse(raw);
      var store = normalizeProjectsStore(parsed);
      projectsTombstones = store.tombstones;
      store.items = store.items.filter(function (p) {
        return !(p && p.id != null && projectsTombstones[String(p.id)]);
      });
      // Persist migration / stripped owners / tombstone filter
      saveProjects(store.items);
      return store.items;
    } catch (e) {
      projectsTombstones = {};
      return [];
    }
  }

  function saveProjects(list) {
    state.projects = stripOwner(list || []);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        items: state.projects,
        tombstones: projectsTombstones || {}
      }));
    } catch (e) { /* quota */ }
  }

  function deleteProject(id) {
    var sid = String(id);
    projectsTombstones[sid] = new Date().toISOString();
    saveProjects(state.projects.filter(function (p) { return !(p && String(p.id) === sid); }));
    state.selected.delete(id);
  }

  function pushActivity(msg) {
    state.activity.unshift({ t: new Date().toISOString(), msg: msg });
    state.activity = state.activity.slice(0, 12);
  }

  function fillSelect(el, options, withEmpty) {
    var html = withEmpty ? '<option value="">Any</option>' : '';
    options.forEach(function (o) {
      html += '<option value="' + esc(o) + '">' + esc(o) + '</option>';
    });
    el.innerHTML = html;
  }

  function normalizeTag(raw) {
    return String(raw == null ? '' : raw).trim().toLowerCase().replace(/\s+/g, '-').slice(0, 32);
  }

  function allTags() {
    var set = {};
    PROJECT_TAGS.forEach(function (t) { set[t] = true; });
    state.projects.forEach(function (p) {
      (p.tags || []).forEach(function (t) {
        var n = normalizeTag(t);
        if (n) set[n] = true;
      });
    });
    return Object.keys(set).sort(function (a, b) {
      var ia = PROJECT_TAGS.indexOf(a);
      var ib = PROJECT_TAGS.indexOf(b);
      if (ia !== -1 || ib !== -1) {
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      }
      return a.localeCompare(b);
    });
  }

  function tagColor(t) {
    if (TAG_COLORS[t]) return TAG_COLORS[t];
    var idx = 0;
    for (var i = 0; i < t.length; i++) idx = (idx + t.charCodeAt(i) * (i + 1)) % TAG_COLOR_FALLBACK.length;
    return TAG_COLOR_FALLBACK[idx];
  }

  function readFormTags() {
    return formTags.slice();
  }

  function renderFormTags() {
    var presets = document.getElementById('pfTagPresets');
    var chips = document.getElementById('pfTagChips');
    if (!presets || !chips) return;

    presets.innerHTML = PROJECT_TAGS.map(function (t) {
      var on = formTags.indexOf(t) !== -1;
      return '<label class="tag-check' + (on ? ' on' : '') + '">' +
        '<input type="checkbox" name="pfTagPreset" value="' + esc(t) + '"' + (on ? ' checked' : '') + ' /> ' +
        esc(t) + '</label>';
    }).join('');

    var custom = formTags.filter(function (t) { return PROJECT_TAGS.indexOf(t) === -1; });
    chips.innerHTML = custom.map(function (t) {
      return '<span class="tag-chip' + tagClass(t) + '">' + esc(t) +
        '<button type="button" data-remove-tag="' + esc(t) + '" aria-label="Remove ' + esc(t) + '">&times;</button></span>';
    }).join('');

    presets.querySelectorAll('input[name="pfTagPreset"]').forEach(function (el) {
      el.addEventListener('change', function () {
        var t = el.value;
        var idx = formTags.indexOf(t);
        if (el.checked && idx === -1) formTags.push(t);
        if (!el.checked && idx !== -1) formTags.splice(idx, 1);
        renderFormTags();
      });
    });

    chips.querySelectorAll('[data-remove-tag]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var t = btn.getAttribute('data-remove-tag');
        formTags = formTags.filter(function (x) { return x !== t; });
        renderFormTags();
      });
    });
  }

  function setFormTags(tags) {
    var seen = {};
    formTags = [];
    (tags || []).forEach(function (raw) {
      var t = normalizeTag(raw);
      if (!t || seen[t]) return;
      seen[t] = true;
      formTags.push(t);
    });
    renderFormTags();
  }

  function addFormTagFromInput() {
    var input = document.getElementById('pfTagInput');
    if (!input) return;
    var t = normalizeTag(input.value);
    if (!t) return;
    if (formTags.indexOf(t) === -1) formTags.push(t);
    input.value = '';
    renderFormTags();
    input.focus();
  }

  function tagClass(t) {
    return PROJECT_TAGS.indexOf(t) !== -1 ? ' tag-' + t : '';
  }

  function matchesPreset(p, preset) {
    switch (preset) {
      case 'dueWeek': return isDueThisWeek(p);
      case 'blocked': return p.status === 'Blocked';
      case 'highPriority': return (p.priority === 'High' || p.priority === 'Critical') && p.status !== 'Archived' && p.status !== 'Completed';
      case 'completedRecent':
        return p.status === 'Completed' && p.updatedAt && p.updatedAt.slice(0, 10) >= daysAgo(30);
      case 'archived': return p.status === 'Archived';
      case 'atRisk': return isAtRisk(p);
      case 'pinned': return !!p.pinned;
      case 'stale': return isStale(p);
      case 'all':
      case 'overview':
      default: return true;
    }
  }

  function applyFilters(list) {
    var f = state.filters;
    var q = state.search.trim().toLowerCase();
    return list.filter(function (p) {
      if (!matchesPreset(p, state.preset)) return false;
      if (f.activeOnly && p.status === 'Archived' && state.preset !== 'archived') return false;
      if (state.preset === 'all' || state.preset === 'overview') {
        /* keep */
      }
      if (f.status && p.status !== f.status) return false;
      if (f.priority && p.priority !== f.priority) return false;
      if (f.risk && p.risk !== f.risk) return false;
      if (f.tag && !(p.tags || []).includes(f.tag)) return false;
      if (f.dueFrom && (!p.dueDate || p.dueDate < f.dueFrom)) return false;
      if (f.dueTo && (!p.dueDate || p.dueDate > f.dueTo)) return false;
      if (f.compMin !== '' && Number(p.completion) < Number(f.compMin)) return false;
      if (f.compMax !== '' && Number(p.completion) > Number(f.compMax)) return false;
      if (f.attention === 'overdue' && !isOverdue(p)) return false;
      if (f.attention === 'blocked' && p.status !== 'Blocked') return false;
      if (f.attention === 'dueWeek' && !isDueThisWeek(p)) return false;
      if (f.attention === 'stale' && !isStale(p)) return false;
      if (q) {
        var hay = [p.name, p.notes, (p.tags || []).join(' '), p.description].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sortProjects(list) {
    var copy = list.slice();
    var s = state.sort;
    copy.sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (s === 'name') return a.name.localeCompare(b.name);
      if (s === 'progress') return (b.completion || 0) - (a.completion || 0);
      if (s === 'priority') return (PRIORITY_RANK[a.priority] || 9) - (PRIORITY_RANK[b.priority] || 9);
      if (s === 'updated') return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
      // due
      var ad = a.dueDate || '9999';
      var bd = b.dueDate || '9999';
      return ad.localeCompare(bd);
    });
    return copy;
  }

  function filtered() {
    return sortProjects(applyFilters(state.projects));
  }

  function updateProject(id, patch) {
    var list = state.projects.map(function (p) {
      if (p.id !== id) return p;
      var next = Object.assign({}, p, patch, { updatedAt: new Date().toISOString() });
      return next;
    });
    saveProjects(list);
  }

  function renderKPIs(list) {
    var all = state.projects;
    var active = all.filter(function (p) { return p.status !== 'Completed' && p.status !== 'Archived'; });
    var atRisk = active.filter(isAtRisk);
    var overdue = active.filter(isOverdue);
    var monthStart = todayISO().slice(0, 7);
    var completedMonth = all.filter(function (p) {
      return p.status === 'Completed' && p.updatedAt && p.updatedAt.slice(0, 7) === monthStart;
    });
    var overall = active.length
      ? Math.round(active.reduce(function (s, p) { return s + (p.completion || 0); }, 0) / active.length)
      : 0;

    document.getElementById('kpiRow').innerHTML =
      kpi('Total', all.length) +
      kpi('Active', active.length, 'ok') +
      kpi('At Risk', atRisk.length, atRisk.length ? 'warn' : '') +
      kpi('Overdue', overdue.length, overdue.length ? 'danger' : '') +
      kpi('Completed This Month', completedMonth.length, 'ok') +
      kpi('Overall Completion %', overall + '%');
  }

  function kpi(label, value, cls) {
    return '<div class="card kpi"><div class="kpi-label">' + esc(label) + '</div>' +
      '<div class="kpi-value ' + (cls || '') + '">' + esc(String(value)) + '</div></div>';

  function renderAttention() {
    var active = state.projects.filter(function (p) { return p.status !== 'Archived' && p.status !== 'Completed'; });
    var overdue = active.filter(isOverdue).length;
    var blocked = state.projects.filter(function (p) { return p.status === 'Blocked'; }).length;
    var dueWeek = active.filter(isDueThisWeek).length;
    var stale = active.filter(isStale).length;
    var att = state.filters.attention;

    document.getElementById('attentionStrip').innerHTML =
      chip('overdue', 'Overdue', overdue, att) +
      chip('blocked', 'Blocked', blocked, att) +
      chip('dueWeek', 'Due this week', dueWeek, att) +
      chip('stale', 'Stale (14+ days)', stale, att);

    document.getElementById('navDueWeek').textContent = String(dueWeek);
    document.getElementById('navBlocked').textContent = String(blocked);
  }

    return '<button type="button" class="chip ' + key + (att === key ? ' active' : '') + '" data-attention="' + key + '">' +

  function groupProjects(list) {
    if (state.group === 'none') return [{ key: '', items: list }];
    var map = {};
    var order = [];
    list.forEach(function (p) {
      var k = p[state.group] || '—';
      if (!map[k]) { map[k] = []; order.push(k); }
      map[k].push(p);
    });
    return order.map(function (k) { return { key: k, items: map[k] }; });

  function renderBoard(list) {
    if (!list.length) {
      return '<div class="card empty">No projects to show on the board.</div>';
    }
    var cols = STATUSES.filter(function (s) { return s !== 'Archived' || state.preset === 'archived' || !state.filters.activeOnly; });
    if (state.filters.activeOnly && state.preset !== 'archived') {
      cols = STATUSES.filter(function (s) { return s !== 'Archived'; });
    }
    var byStatus = {};
    cols.forEach(function (s) { byStatus[s] = []; });
    list.forEach(function (p) {
      if (byStatus[p.status]) byStatus[p.status].push(p);
      else {
        if (!byStatus[p.status]) byStatus[p.status] = [];
        byStatus[p.status].push(p);
        if (cols.indexOf(p.status) === -1) cols.push(p.status);
      }
    });

    var html = '<div class="board">';
    cols.forEach(function (s) {

  function renderTimeline(list) {
    var withDue = list.filter(function (p) { return p.dueDate; });
    var noDue = list.filter(function (p) { return !p.dueDate; });
    if (!list.length) {
      return '<div class="card empty">No projects for the timeline.</div>';
    }
    var months = {};
    var order = [];
    withDue.slice().sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); }).forEach(function (p) {
      var m = p.dueDate.slice(0, 7);
      if (!months[m]) { months[m] = []; order.push(m); }
      months[m].push(p);
    });
    var html = '';
    order.forEach(function (m) {
      var label = m;
      try {
        var d = new Date(m + '-01T12:00:00');
        label = d.toLocaleString(undefined, { month: 'long', year: 'numeric' });
      } catch (e) { /* keep */ }
      html += '<div class="timeline-month card" style="margin-bottom:12px"><h3>' + esc(label) + '</h3>';
      months[m].forEach(function (p) {
        html += '<div class="timeline-item">' +
          '<div class="timeline-date' + (isOverdue(p) ? ' overdue' : '') + '">' + esc(p.dueDate) + '</div>' +
          '<div style="flex:1"><button type="button" class="proj-name-btn" data-action="edit" data-id="' + esc(p.id) + '">' + esc(p.name) + '</button>' +
          '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
          statusBadge(p.status) + priorityBadge(p.priority) +
          '</div></div></div>';
      });
      html += '</div>';
    });
    if (noDue.length) {
      html += '<div class="timeline-month card"><h3>No due date</h3>';
      noDue.forEach(function (p) {
        html += '<div class="timeline-item"><div class="timeline-date">—</div><div><button type="button" class="proj-name-btn" data-action="edit" data-id="' + esc(p.id) + '">' + esc(p.name) + '</button></div></div>';
      });
      html += '</div>';
    }
    return html;
  }

  function renderAnalytics() {
    var all = state.projects.filter(function (p) { return p.status !== 'Archived'; });
    var statusCounts = {};
    STATUSES.forEach(function (s) { statusCounts[s] = 0; });
    all.forEach(function (p) { statusCounts[p.status] = (statusCounts[p.status] || 0) + 1; });

    var colors = {
      'Not Started': '#76746E',
      'Planning': '#7DD3FC',
      'In Progress': '#6BE3A4',
      'Blocked': '#FF6B6B',
      'On Hold': '#F2C063',
      'Completed': '#4ADE80',
      'Archived': '#555'
    };

    var total = all.length || 1;
    var cx = 48, cy = 48, r = 36, ir = 22;
    var angle = -Math.PI / 2;
    var paths = '';
    var legend = '';
    STATUSES.forEach(function (s) {
      var n = statusCounts[s] || 0;
      if (!n) return;
      var slice = (n / total) * Math.PI * 2;
      var x1 = cx + r * Math.cos(angle);
      var y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(angle + slice);
      var y2 = cy + r * Math.sin(angle + slice);
      var xi1 = cx + ir * Math.cos(angle);
      var yi1 = cy + ir * Math.sin(angle);
      var xi2 = cx + ir * Math.cos(angle + slice);
      var yi2 = cy + ir * Math.sin(angle + slice);
      var large = slice > Math.PI ? 1 : 0;
      paths += '<path d="M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 +
        ' L ' + xi2 + ' ' + yi2 + ' A ' + ir + ' ' + ir + ' 0 ' + large + ' 0 ' + xi1 + ' ' + yi1 + ' Z" fill="' + (colors[s] || '#888') + '" />';
      legend += '<span><i class="dot" style="background:' + (colors[s] || '#888') + '"></i>' + esc(s) + ' (' + n + ')</span>';
      angle += slice;
    });

    var donut = '<div class="card"><h3>Status mix</h3><div class="chart-wrap">' +
      '<svg width="96" height="96" viewBox="0 0 96 96" aria-label="Status donut">' + paths + '</svg>' +
      '<div class="legend">' + legend + '</div></div></div>';

    // Completion trend: average completion by updated week buckets (last 6 weeks)
    var points = [];
    for (var w = 5; w >= 0; w--) {
      var end = daysAgo(w * 7);
      var start = daysAgo(w * 7 + 6);
      var bucket = all.filter(function (p) {
        var u = (p.updatedAt || '').slice(0, 10);
        return u >= start && u <= end;
      });
      var avg = bucket.length
        ? bucket.reduce(function (s, p) { return s + (p.completion || 0); }, 0) / bucket.length
        : (points.length ? points[points.length - 1].y : 40);
      points.push({ x: 5 - w, y: avg, label: end.slice(5) });
    }
    var linePts = points.map(function (pt, i) {
      var x = 20 + (i / 5) * 160;
      var y = 90 - (pt.y / 100) * 70;
      return x + ',' + y;
    }).join(' ');
    var trend = '<div class="card"><h3>Completion trend</h3>' +
      '<svg width="100%" height="110" viewBox="0 0 200 110" preserveAspectRatio="none" aria-label="Completion trend">' +
      '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="' + linePts + '" />' +
      points.map(function (pt, i) {
        var x = 20 + (i / 5) * 160;
        var y = 90 - (pt.y / 100) * 70;
        return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="var(--accent)" />';
      }).join('') +
      '</svg></div>';

    // Projects by tag (pie)
    var tagCounts = {};
    PROJECT_TAGS.forEach(function (t) { tagCounts[t] = 0; });
    all.forEach(function (p) {
      (p.tags || []).forEach(function (raw) {
        var t = normalizeTag(raw);
        if (!t) return;
        tagCounts[t] = (tagCounts[t] || 0) + 1;
      });
    });
    var tagEntries = allTags().map(function (t) {
      return { key: t, n: tagCounts[t] || 0, color: tagColor(t) };
    }).filter(function (e) { return e.n > 0; });
    var tagTotal = tagEntries.reduce(function (s, e) { return s + e.n; }, 0);
    var tagPaths = '';
    var tagLegend = '';
    var tagAngle = -Math.PI / 2;
    var tcx = 48;
    var tcy = 48;
    var tr = 40;
    if (!tagTotal) {
      tagPaths = '<circle cx="' + tcx + '" cy="' + tcy + '" r="' + tr + '" fill="rgba(255,255,255,0.08)" />';
      tagLegend = '<span>No tagged projects</span>';
    } else {
      tagEntries.forEach(function (e) {
        var slice = (e.n / tagTotal) * Math.PI * 2;
        var x1 = tcx + tr * Math.cos(tagAngle);
        var y1 = tcy + tr * Math.sin(tagAngle);
        var x2 = tcx + tr * Math.cos(tagAngle + slice);
        var y2 = tcy + tr * Math.sin(tagAngle + slice);
        var large = slice > Math.PI ? 1 : 0;
        if (tagEntries.length === 1) {
          tagPaths += '<circle cx="' + tcx + '" cy="' + tcy + '" r="' + tr + '" fill="' + e.color + '" />';
        } else {
          tagPaths += '<path d="M ' + tcx + ' ' + tcy + ' L ' + x1 + ' ' + y1 +
            ' A ' + tr + ' ' + tr + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 +
            ' Z" fill="' + e.color + '" />';
        }
        tagLegend += '<span><i class="dot" style="background:' + e.color + '"></i>' + esc(e.key) + ' (' + e.n + ')</span>';
        tagAngle += slice;
      });
    }
    var byTag = '<div class="card"><h3>Projects by tag</h3><div class="chart-wrap">' +
      '<svg width="96" height="96" viewBox="0 0 96 96" aria-label="Projects by tag pie">' + tagPaths + '</svg>' +
      '<div class="legend">' + tagLegend + '</div></div></div>';

    var staleList = all.filter(isStale).slice(0, 5).map(function (p) {
      return '<li><span>' + esc(p.name) + '</span><span>' + esc((p.updatedAt || '').slice(0, 10) || '—') + '</span></li>';
    }).join('') || '<li>No stale projects</li>';

    var upcoming = all.filter(function (p) {
      return p.dueDate && p.status !== 'Completed' && p.dueDate >= todayISO();
    }).sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); }).slice(0, 5).map(function (p) {
      return '<li><span>' + esc(p.name) + '</span><span class="' + (isOverdue(p) ? 'date-cell overdue' : '') + '">' + esc(p.dueDate) + '</span></li>';
    }).join('') || '<li>No upcoming deadlines</li>';

    var act = (state.activity.length ? state.activity : [
      { t: new Date().toISOString(), msg: 'Loaded projects workspace' }
    ]).slice(0, 6).map(function (a) {
      return '<li><span>' + esc(a.msg) + '</span><span>' + esc(a.t.slice(0, 10)) + '</span></li>';
    }).join('');

    var lists = '<div class="card"><h3>Stale projects</h3><ul class="mini-list">' + staleList + '</ul></div>' +
      '<div class="card"><h3>Upcoming deadlines</h3><ul class="mini-list">' + upcoming + '</ul></div>' +
      '<div class="card"><h3>Recent activity</h3><ul class="mini-list">' + act + '</ul></div>';

    document.getElementById('analyticsRow').innerHTML = donut + trend + byTag + lists;
  }

    else if (state.mode === 'timeline') pane.innerHTML = renderTimeline(list);

  function bindDynamic() {
    document.querySelectorAll('.status-select').forEach(function (sel) {
      sel.addEventListener('change', function () {
        updateProject(sel.getAttribute('data-id'), { status: sel.value });
        if (sel.value === 'Completed') updateProject(sel.getAttribute('data-id'), { completion: 100 });
        pushActivity('Status → ' + sel.value);
        render();
      });
    });

    document.querySelectorAll('[data-pin]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-pin');
        var p = state.projects.find(function (x) { return x.id === id; });
        if (!p) return;
        updateProject(id, { pinned: !p.pinned });
        pushActivity((p.pinned ? 'Unpinned' : 'Pinned') + ' ' + p.name);
        render();
      });
    });

    document.querySelectorAll('[data-menu]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-menu');
        var menu = document.getElementById('menu-' + id);
        var open = menu.classList.contains('open');
        document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open'); });
        if (!open) menu.classList.add('open');
      });
    });

    document.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        handleAction(btn.getAttribute('data-action'), btn.getAttribute('data-id'));
      });
    });

    document.querySelectorAll('.row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-id');
        if (cb.checked) state.selected.add(id);
        else state.selected.delete(id);
        renderBulk();
        // sync other checkboxes for same id
        document.querySelectorAll('.row-check[data-id="' + id + '"]').forEach(function (other) {
          other.checked = cb.checked;
        });
      });
    });

    var selectAll = document.getElementById('selectAll');
    if (selectAll) {
      selectAll.addEventListener('change', function () {
        var list = filtered();
        list.forEach(function (p) {
          if (selectAll.checked) state.selected.add(p.id);
          else state.selected.delete(p.id);
        });
        render();
      });
    }

    document.querySelectorAll('[data-attention]').forEach(function (chipEl) {
      chipEl.addEventListener('click', function () {
        var key = chipEl.getAttribute('data-attention');
        state.filters.attention = state.filters.attention === key ? '' : key;
        render();
      });
    });

    document.querySelectorAll('[data-board-id]').forEach(function (card) {
      card.addEventListener('click', function () {
        var id = card.getAttribute('data-board-id');
        var p = state.projects.find(function (x) { return x.id === id; });
        if (!p) return;
        var idx = STATUSES.indexOf(p.status);
        var next = STATUSES[(idx + 1) % STATUSES.length];
        if (next === 'Archived' && p.status !== 'Completed') next = 'Completed';
        var patch = { status: next };
        if (next === 'Completed') patch.completion = 100;
        updateProject(id, patch);
        pushActivity(p.name + ' → ' + next);
        render();
      });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
      });
    });
  }

  function handleAction(action, id) {
    var p = state.projects.find(function (x) { return x.id === id; });
    if (!p && action !== 'delete') return;
    document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open'); });

    if (action === 'edit') {
      openModal(p);
      return;
    }
    if (action === 'complete' || action === 'completeToday') {
      updateProject(id, {
        status: 'Completed',
        completion: 100,
        dueDate: action === 'completeToday' ? todayISO() : p.dueDate
      });
      pushActivity('Completed ' + p.name);
      render();
      return;
    }
    if (action === 'archive') {
      updateProject(id, { status: 'Archived' });
      pushActivity('Archived ' + p.name);
      render();
      return;
    }
    if (action === 'duplicate') {
      var copy = Object.assign({}, p, {
        id: uid(),
        name: p.name + ' (copy)',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        pinned: false
      });
      saveProjects([copy].concat(state.projects));
      pushActivity('Duplicated ' + p.name);
      render();
      return;
    }
    if (action === 'delete') {
      if (!confirm('Delete this project?')) return;
      var name = p ? p.name : id;
      deleteProject(id);
      pushActivity('Deleted ' + name);
      render();
    }
  }

    document.getElementById('pfId').value = isEdit ? project.id : '';
    document.getElementById('pfName').value = isEdit ? project.name : '';
    document.getElementById('pfDesc').value = isEdit ? (project.description || '') : '';
    document.getElementById('pfStatus').value = isEdit ? project.status : 'Not Started';
    document.getElementById('pfPriority').value = isEdit ? project.priority : 'Medium';
    document.getElementById('pfRisk').value = isEdit ? project.risk : 'Low';
    document.getElementById('pfStart').value = isEdit ? (project.startDate || '') : todayISO();
    document.getElementById('pfDue').value = isEdit ? (project.dueDate || '') : '';
    document.getElementById('pfCompletion').value = isEdit ? (project.completion || 0) : 0;
    setFormTags(isEdit ? (project.tags || []) : []);
    document.getElementById('pfNotes').value = isEdit ? (project.notes || '') : '';
    document.getElementById('pfBlocked').value = isEdit ? (project.blockedReason || '') : '';
    document.getElementById('formError').classList.remove('show');
    document.getElementById('modalBackdrop').classList.add('open');
    setTimeout(function () { document.getElementById('pfName').focus(); }, 50);
  }

  function setPreset(preset) {
    state.preset = preset === 'overview' ? 'all' : preset;
    state.filters.attention = '';
    if (preset === 'archived') {
      state.filters.activeOnly = false;
      document.getElementById('fActiveOnly').checked = false;
    } else if (document.getElementById('fActiveOnly').checked === false && preset !== 'archived') {
      /* leave activeOnly as user set */
    }
    var navKey = preset === 'all' ? 'all' : preset;
    document.querySelectorAll('.nav-link').forEach(function (n) {
      n.classList.toggle('active', n.getAttribute('data-nav') === navKey ||
        (preset === 'overview' && n.getAttribute('data-nav') === 'overview'));

    });
    document.getElementById('modalBackdrop').addEventListener('click', function (e) {

    });

    document.getElementById('projectForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('pfName').value.trim();
      var start = document.getElementById('pfStart').value;
      var due = document.getElementById('pfDue').value;
      var err = document.getElementById('formError');
      if (!name) {
        err.textContent = 'Name is required.';
        err.classList.add('show');
        return;
      }
      if (start && due && due < start) {
        err.textContent = 'Due date must be on or after start date.';
        err.classList.add('show');
        return;
      }
      err.classList.remove('show');
      var tags = readFormTags();
      var id = document.getElementById('pfId').value;
      var payload = {
        name: name,
        description: document.getElementById('pfDesc').value.trim(),
        status: document.getElementById('pfStatus').value,
        priority: document.getElementById('pfPriority').value,
        risk: document.getElementById('pfRisk').value,
        startDate: start,
        dueDate: due,
        completion: Math.max(0, Math.min(100, Number(document.getElementById('pfCompletion').value) || 0)),
        tags: tags,
        notes: document.getElementById('pfNotes').value.trim(),
        blockedReason: document.getElementById('pfBlocked').value.trim()
      };
      if (payload.status === 'Completed') payload.completion = 100;

      if (id) {
        updateProject(id, payload);
        pushActivity('Updated ' + name);
      } else {
        var now = new Date().toISOString();
        var neo = Object.assign({
          id: uid(),
          createdAt: now,
          updatedAt: now,
          milestones: [],
          tasksTotal: 0,
          tasksDone: 0,
          tasksOverdue: 0,
          links: [],
          effortEst: 0,
          effortActual: 0,
          budget: 0,
          pinned: false,
          dependsOn: [],
          reminder: ''
        }, payload);
        saveProjects([neo].concat(state.projects));
        pushActivity('Created ' + name);
      }
      closeModal();
      fillSelect(document.getElementById('fTag'), allTags(), true);
      render();
    });

    document.getElementById('bulkComplete').addEventListener('click', function () {
      state.selected.forEach(function (id) {
        updateProject(id, { status: 'Completed', completion: 100 });
      });
      pushActivity('Bulk completed ' + state.selected.size);
      state.selected.clear();
      render();
    });

    document.getElementById('bulkArchive').addEventListener('click', function () {
      state.selected.forEach(function (id) {
        updateProject(id, { status: 'Archived' });
      });
      pushActivity('Bulk archived ' + state.selected.size);
      state.selected.clear();
      render();
    });

    document.getElementById('bulkStatus').addEventListener('change', function (e) {
      var v = e.target.value;
      if (!v) return;
      state.selected.forEach(function (id) {
        var patch = { status: v };
        if (v === 'Completed') patch.completion = 100;
        updateProject(id, patch);
      });
      pushActivity('Bulk status → ' + v);
      e.target.value = '';
      state.selected.clear();
      render();
    });

    document.getElementById('bulkClear').addEventListener('click', function () {
      state.selected.clear();
      render();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeModal();
        document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open'); });
        closeSidebar();
      }
    });

    document.addEventListener('click', function () {
      document.querySelectorAll('.dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    });
  }

  function boot() {
    state.projects = loadProjects();
    initFormSelects();
    wireEvents();

    setTimeout(function () {
      document.getElementById('skeleton').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');
      render();
    }, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
