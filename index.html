<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JGDash — Pages</title>

  <script>!function(){try{if(localStorage.getItem('jg_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}}()</script>

  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --bg: #050506;
      --card-bg: rgba(255, 255, 255, 0.04);
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text-primary);
      background: var(--bg);
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 60%),
        radial-gradient(ellipse 45% 35% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 55%);
      filter: blur(40px);
      animation: wash-drift 36s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.014) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
    }
    @keyframes wash-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-3%, 2%) scale(1.04); }
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 20px 48px;
    }
    .dash-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 8px 0 20px;
      background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bento {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 168px;
      gap: 14px;
      grid-auto-flow: dense;
    }
    .tile {
      --accent: #6BE3A4;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 18px 20px;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      position: relative;
      overflow: hidden;
    }
    .tile:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
    }
    .tile.big { grid-column: span 2; grid-row: span 2; }
    .tile.wide { grid-column: span 2; }
    .tile-num {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }
    .tile-emoji {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 28px;
      filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent));
      line-height: 1;
    }
    .tile-spacer { flex: 1; min-height: 12px; }
    .tile-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    .tile.big .tile-title { font-size: 28px; }
    .tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .tile-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .tile-arrow {
      color: var(--accent);
      font-size: 18px;
      transition: transform 0.22s ease;
    }
    .tile:hover .tile-arrow { transform: translateX(4px); }

    @media (max-width: 720px) {
      .bento { grid-template-columns: repeat(2, 1fr); }
      .tile.big { grid-row: span 1; }
    }
    @media (max-width: 440px) {
      .bento { grid-template-columns: 1fr; }
      .tile.big, .tile.wide { grid-column: span 1; }
      .dash-title { font-size: 22px; }
    }
  </style>
</head>
<body data-page-title="Hub">

        <span class="tile-footer">

          <span class="tile-arrow">→</span>
        </span>
      </a>
      <a class="tile wide" style="--accent:#7DD3FC" href="training.html">

        <span class="tile-emoji">⚽</span>
        <span class="tile-spacer"></span>

        </span>
      </a>
      <a class="tile" style="--accent:#A7F3D0" href="health.html">
        <span class="tile-num">·03</span>

    </div>
