<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JGDash — Fitness</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/sync.js"></script>
  <script>!function(){try{if(localStorage.getItem('jg_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}}()</script>
  <script src="js/theme.js"></script>
  <script src="js/topbar.js"></script>
  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --bg: #050506;
      --card-bg: rgba(255, 255, 255, 0.04);
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: var(--sans); color: var(--text-primary); background: var(--bg); position: relative; }
    body::before {
      content: ''; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 60%),
        radial-gradient(ellipse 45% 35% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 55%);
      filter: blur(40px);
      animation: wash-drift 36s ease-in-out infinite alternate;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.014) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
    }
    @keyframes wash-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-3%, 2%) scale(1.04); }
    }
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 12px 20px 48px; }
    .dash-title {
      font-size: 28px; font-weight: 700; letter-spacing: -0.025em; margin: 8px 0 16px;
      background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card-bg); border-radius: 16px; padding: 22px;
      backdrop-filter: blur(24px) saturate(1.2); box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      color: var(--text-secondary); line-height: 1.5;
    }
    a { color: #6BE3A4; }
  </style>
</head>
<body data-page-title="Fitness">
  <div class="wrap">
    <h1 class="dash-title">💪 Fitness</h1>
    <div class="card">
      <p>Workouts, splits, and session tracking — coming soon.</p>
      <p style="margin-top:14px"><a href="index.html">← Back to Dashboard</a></p>
    </div>
  </div>
</body>
</html>
